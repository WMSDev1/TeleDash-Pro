name: Release

# Every push to main (a merged pull request) whose app/appinfo.json "version" has no GitHub
# Release yet builds the ipk, creates the tag vX.Y.Z and a GitHub Release with the ipk and its
# Homebrew Channel manifest, and deploys the project site with the Homebrew Channel repository
# (repo/apps.json) to GitHub Pages. A push that keeps an already released version does nothing.
# Actions > Release > Run workflow (on main) does the same by hand, e.g. after adding a secret.
# One-time repository setting: Settings > Pages > Source: GitHub Actions.
# Optional repository variable TELEDASH_PAGES_BASE overrides the Pages address (custom domain).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ipk: ${{ steps.meta.outputs.ipk }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no token in .git/config while npm tools install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Is this version already released?
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_OVERRIDE: ${{ vars.TELEDASH_PAGES_BASE }}
        run: |
          VER=$(node -p 'require("./app/appinfo.json").version')
          ID=$(node -p 'require("./project.json").appId')
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VER is already released; nothing to publish. Raise the version in app/appinfo.json to release."
            exit 0
          fi
          # TVs only install a newer version, so never publish one below the latest release.
          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          LATEST=${LATEST#v}
          if [ -n "$LATEST" ]; then
            node -e 'const v=s=>s.split(".").map(Number),[a,b]=[v(process.argv[1]),v(process.argv[2])];
              for(let i=0;i<3;i++){if(b[i]>a[i])process.exit(0);if(b[i]<a[i])break}
              console.error("version "+process.argv[2]+" is not newer than the latest release "+process.argv[1]);process.exit(1)' "$LATEST" "$VER"
          fi
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO=${GITHUB_REPOSITORY#*/}
          if [ -n "$PAGES_BASE_OVERRIDE" ]; then BASE=${PAGES_BASE_OVERRIDE%/}
          elif [ "$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')" = "$OWNER.github.io" ]; then BASE="https://$OWNER.github.io"
          else BASE="https://$OWNER.github.io/$REPO"; fi
          {
            echo "release=true"
            echo "version=$VER"
            echo "ipk=${ID}_${VER}_all.ipk"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "version $VER, pages $BASE"

      - name: Install acorn for the ES5 check
        if: steps.meta.outputs.release == 'true'
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/tools" acorn@8.19.0
          echo "NODE_PATH=$RUNNER_TEMP/tools/node_modules" >> "$GITHUB_ENV"
      - run: sh scripts/check.sh
        if: steps.meta.outputs.release == 'true'

      # pagesBase turns on Google sign-in and automatic updates in the packaged app.
      - name: Fill pagesBase in project.json
        if: steps.meta.outputs.release == 'true'
        env:
          BASE: ${{ steps.meta.outputs.base }}
        run: |
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("project.json","utf8"));
            p.pagesBase=process.env.BASE; fs.writeFileSync("project.json", JSON.stringify(p,null,2)+"\n")'
          cat project.json

      - name: Install the webOS packager
        if: steps.meta.outputs.release == 'true'
        # Exact version, no install scripts (its only one chmods config files; packaging works
        # without it): this job builds what TVs later run as root.
        run: npm install --global --no-audit --no-fund --ignore-scripts @webos-tools/cli@3.2.6

      - name: Build the ipk
        if: steps.meta.outputs.release == 'true'
        env:
          EXPECT_VERSION: ${{ steps.meta.outputs.version }}
          # Repository secret: the Google OAuth client JSON (ADR-31). Required for releases.
          TELEDASH_GOOGLE_CLIENT: ${{ secrets.TELEDASH_GOOGLE_CLIENT }}
        run: |
          # A release without the built-in client would silently fall back to "bring your own
          # client" on every TV, so stop here instead.
          if [ -z "$TELEDASH_GOOGLE_CLIENT" ]; then
            echo "::error::Repository secret TELEDASH_GOOGLE_CLIENT is not set (docs/RELEASING.md, The project's Google client)."
            exit 1
          fi
          bash scripts/build.sh

      - name: Homebrew Channel manifest and repository index
        if: steps.meta.outputs.release == 'true'
        env:
          BASE: ${{ steps.meta.outputs.base }}
          IPK: ${{ steps.meta.outputs.ipk }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          rm -rf _site && mkdir -p _site
          cp -R site/. _site/
          node scripts/manifest.js --ipk "build/$IPK" --out _site/repo --base "$BASE" \
            --ipk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$IPK" \
            --source-url "https://github.com/$GITHUB_REPOSITORY"
          mkdir -p dist
          cp "build/$IPK" _site/repo/*.manifest.json dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.meta.outputs.release == 'true'
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.meta.outputs.release == 'true'
        with:
          path: _site/

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Creates the tag vX.Y.Z on the commit that was built.
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TeleDash Pro $VERSION" --generate-notes

  # After the Release, so the ipkUrl in the published manifest already resolves.
  pages:
    needs: [build, release]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
