<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TeleDash Pro</title>
<style>
  html { background: #101318; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden;
    color: #f2f4f7; font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif; }
  #bg { position: absolute; left: 0; top: 0; z-index: -1; }
  #top { display: flex; justify-content: space-between; align-items: flex-end; padding: 36px 100px 0; }
  #clock { font-size: 120px; font-weight: 300; line-height: 1; }
  #date { font-size: 34px; color: #d3d9e2; margin-top: 10px; }
  #now { text-align: right; }
  #temp { font-size: 96px; font-weight: 300; line-height: 1; }
  #wx { font-size: 32px; color: #d3d9e2; margin-top: 10px; }
  /* Offline indicator: amber line under the weather, only present when there is something to say. */
  #net, #inet { color: #ffb300; }
  #net { font-size: 28px; margin-top: 10px; }
  #net:empty, #inet:empty { display: none; }
  #net::before, #inet::before { content: ""; display: inline-block; width: 16px; height: 16px;
    border-radius: 8px; background: #ffb300; margin-right: 12px; }

  #grid { display: grid; gap: 12px; padding: 24px 100px 0; }
  .tile { height: 104px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 600; color: #fff; box-sizing: border-box;
    border: 2px solid #2a303a; transition: transform .12s;
    text-align: center; padding: 0 8px; line-height: 1.15; overflow: hidden; }   /* long app names wrap */
  .tile img { width: 84px; height: 84px; }
  .tile.long { font-size: 20px; }
  .tile img { object-fit: contain; }
  .tile.focus { transform: scale(1.08); border-color: #ffb300;
    box-shadow: 0 0 0 6px #ffb300, 0 10px 30px rgba(0,0,0,.6); }

  #forecast { display: flex; padding: 28px 100px 0; }   /* no flex `gap`: the TV's browser engine predates it */
  .panel { background: rgba(16,19,24,0.72); border-radius: 16px; padding: 22px 26px; box-sizing: border-box; height: 372px; }
  #periods { width: 640px; }
  #days { flex: 1; margin-left: 28px; }
  .ptitle { font-size: 24px; color: #a9b1bd; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .prow { display: flex; margin-bottom: 14px; }
  .pcell { flex: 1; }
  .pcell .when { font-size: 24px; color: #a9b1bd; }
  .pcell .t { font-size: 50px; font-weight: 300; line-height: 1.15; }
  .pcell .s { font-size: 24px; }
  .pcell .p { font-size: 22px; color: #6fb7ff; }
  .pcell.past { opacity: .4; }
  /* Calendar rows (shown in the left panel in place of the Today/Tomorrow weather when a calendar is loaded). */
  .arow { display: flex; font-size: 26px; line-height: 38px; white-space: nowrap; }
  .arow .at { width: 172px; flex: none; color: #a9b1bd; }
  .arow .as { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .arow.quiet { color: #a9b1bd; }
  .agap { margin-top: 12px; }
  #dayrow { display: flex; height: 290px; }
  .day { flex: 1; text-align: center; border-left: 1px solid #262c36; padding: 6px 4px 0; }
  .day:first-child { border-left: 0; }
  .day .d { font-size: 26px; font-weight: 600; }
  .day .n { font-size: 22px; color: #a9b1bd; }
  .day .hi { font-size: 44px; font-weight: 300; margin-top: 22px; line-height: 1.1; }
  .day .lo { font-size: 32px; color: #a9b1bd; }
  .day .s { font-size: 22px; margin-top: 18px; min-height: 54px; }
  .day .p { font-size: 22px; color: #6fb7ff; margin-top: 6px; }
  /* Idle view: dim time and weather on black, drifting so nothing sits still on the OLED. */
  #idle { display: none; position: absolute; left: 0; top: 0; width: 760px; opacity: .5;
    transition: transform 55s linear; }
  #iclock { font-size: 210px; font-weight: 200; line-height: 1; }
  #idate { font-size: 44px; margin-top: 8px; }
  #iwx { font-size: 44px; margin-top: 18px; color: #a9b1bd; }
  #inet { font-size: 36px; margin-top: 14px; }
  body.idle #top, body.idle #grid, body.idle #forecast, body.idle #status { display: none; }
  body.idle #idle { display: block; }
  /* Standby is watched in a dark bedroom: dark grey text, dimmed accents (all still at the 0.5 opacity above). */
  #idle { color: #6b7078; }
  #idate { color: #5a5f66; }
  #iwx { color: #4f545b; }
  #idle #icount { color: #6b5a33; }
  #idle #inet, #idle #ialert { color: #6b5420; }
  #idle #ialert.severe { color: #8a4040; }
  #idle #inet::before { background: #6b5420; }
  /* Night mode (Night tile or red button): far darker and lower contrast than standby, in a deep
     amber-red, thin clock, extras hidden. Rendered values about a third of standby's brightness. */
  body.night #idle { opacity: 1; color: #301509; }
  body.night #iclock { font-weight: 100; }
  body.night #idate, body.night #iwx { color: #22100a; }
  body.night #icount, body.night #inet { display: none; }
  body.night #ialert { color: #2e1410; }
  #status { position: absolute; left: 100px; bottom: 14px; font-size: 24px; color: #7d8794; }

  /* Countdown line under the date; air quality and weather warnings under the weather. */
  #count, #icount, #bcount { color: #ffcf66; }
  #count { font-size: 30px; margin-top: 8px; }
  #count:empty, #icount:empty, #bcount:empty, #aq:empty, #alert:empty, #ialert:empty, #balert:empty { display: none; }
  #aq { font-size: 32px; color: #a9b1bd; }
  #aq::before { content: "  ·  "; color: #d3d9e2; }
  #aq.warn, #aq.severe, #baq.warn { color: #ffb300; }
  #aq.severe, #baq.severe { color: #ff6b6b; }
  #alert, #ialert, #balert { color: #ffb300; font-size: 28px; margin-top: 8px; }
  #alert.severe, #ialert.severe, #balert.severe { color: #ff6b6b; font-weight: 600; }
  #alert::before, #ialert::before, #balert::before { content: "\26A0\FE0E  "; }
  #icount { font-size: 36px; margin-top: 14px; }
  #ialert { font-size: 36px; }

  /* Market strip, bottom right. */
  #market { position: absolute; right: 100px; bottom: 12px; font-size: 24px; color: #d3d9e2; white-space: nowrap; }
  #market .q { margin-left: 40px; }
  #market .ql { color: #8b95a3; margin-right: 10px; }
  #market .qv { margin-right: 10px; }
  #market .up { color: #4cd07d; }
  #market .down { color: #ff6b6b; }
  body.idle #market { display: none; }

  /* Morning brief: full brightness, big and readable from across the room. */
  #brief { display: none; padding: 70px 100px 0; }
  body.brief #top, body.brief #grid, body.brief #forecast, body.brief #status { display: none; }
  body.brief #brief { display: flex; }
  #bleft { width: 860px; flex: none; }
  #bclock { font-size: 220px; font-weight: 200; line-height: 1; }
  #bdate { font-size: 52px; margin-top: 10px; }
  #bcount { font-size: 38px; margin-top: 12px; }
  #bnow { font-size: 56px; font-weight: 300; margin-top: 40px; }
  #baq { font-size: 32px; color: #a9b1bd; margin-top: 10px; }
  #baq:empty { display: none; }
  #balert { font-size: 36px; }
  #bperiods { margin-top: 30px; height: auto; }
  #bright { flex: 1; margin-left: 60px; height: 880px; }
  #bright .arow { font-size: 34px; line-height: 54px; }
  #bright .arow .at { width: 210px; }
  #bright .ptitle { font-size: 28px; }
  /* Setup overlay (Set up tile, 0 or blue key) and the one-time helper install question. */
  #setup { display: none; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 10;
    background: rgba(8,10,14,0.96); }
  body.setup #setup { display: flex; align-items: center; justify-content: center; }
  #sqr { width: 420px; height: 420px; flex: none; margin-right: 80px; border-radius: 16px; overflow: hidden; background: #fff; }
  #sqr:empty { display: none; }
  #sqr svg { display: block; width: 420px; height: 420px; }
  #stext { width: 980px; }
  #stitle { font-size: 64px; font-weight: 300; line-height: 1.1; }
  #smsg { font-size: 36px; color: #d3d9e2; margin-top: 26px; line-height: 1.35; }
  #surl { font-size: 34px; color: #ffcf66; margin-top: 30px; font-family: Menlo, Consolas, monospace; word-break: break-all; }
  #scode { font-size: 44px; margin-top: 18px; letter-spacing: 4px; }
  #sbtns { margin-top: 44px; }
  #sfoot { font-size: 26px; color: #7d8794; margin-top: 40px; }
  #surl:empty, #scode:empty, #sbtns:empty, #sfoot:empty { display: none; }
  .btn { display: inline-block; font-size: 36px; padding: 18px 54px; margin-right: 28px; border-radius: 14px;
    background: #232a35; border: 2px solid #2a303a; }
  .btn.focus { border-color: #ffb300; box-shadow: 0 0 0 6px #ffb300; }

  /* Music view (Music tile or yellow key): Spotify full screen. #mviz is the visualizer's canvas;
     #mover (artwork, title, controls, library) fades and drifts so nothing sits still on the OLED.
     Two looks share one layout: the plain one below, and #music.retro (settings.music.skin). */
  #music { display: none; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 5; background: #000; }
  body.music #music { display: block; }
  body.music #top, body.music #grid, body.music #forecast, body.music #status, body.music #market, body.music #bg { display: none; }
  #mviz { position: absolute; left: 0; top: 0; }
  #mover { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #mwin { position: absolute; left: 100px; bottom: 80px; width: 1720px; text-shadow: 0 2px 14px rgba(0,0,0,.85); }
  .mwbar { display: none; }
  #mbody { display: grid; grid-template-columns: 400px 1fr; grid-column-gap: 56px; align-items: end; }
  #mart { grid-column: 1; grid-row: 1 / span 4; width: 400px; height: 400px; border-radius: 14px; overflow: hidden; background: #171b22; }
  #martimg { display: block; width: 100%; height: 100%; object-fit: cover; }
  #mlcd, #mseek, #mctl, #mstat { grid-column: 2; min-width: 0; }
  #mlcdtop { display: none; }
  #mtitle, #martist, #malbum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mtitle { font-size: 68px; font-weight: 300; line-height: 1.15; }
  #mtitle span { display: inline-block; }
  #martist { font-size: 40px; color: #d3d9e2; margin-top: 8px; }
  #malbum { font-size: 30px; color: #8b95a3; margin-top: 6px; }
  #mseek { display: flex; align-items: center; margin-top: 30px; }
  #mpos, #mdur { flex: none; width: 96px; font-size: 26px; color: #8b95a3; }
  #mdur { text-align: right; }
  #mbar { flex: 1; height: 8px; border-radius: 4px; background: #2a303a; overflow: hidden; }
  #mfill { height: 100%; width: 0; background: #f2f4f7; }
  #mctl { margin-top: 18px; white-space: nowrap; height: 96px; }
  .mbtn { display: inline-flex; align-items: center; justify-content: center; vertical-align: top; min-width: 88px; height: 88px;
    padding: 0 16px; margin: 4px 14px 4px 0; box-sizing: border-box; border-radius: 44px; border: 2px solid #2a303a;
    background: rgba(35,42,53,.85); color: #f2f4f7; font-size: 28px; font-weight: 600; text-shadow: none; }
  .mbtn.focus { border-color: #ffb300; box-shadow: 0 0 0 5px #ffb300; }
  .mbtn.on { color: #4cd07d; }
  .mbtn.fill svg path { fill: currentColor; }
  .mbtn.hide { display: none; }
  .mbtn[data-one="1"]::after { content: "1"; font-size: 22px; margin-left: 2px; }
  #mstat { margin-top: 12px; min-height: 34px; }
  #mdev { display: block; font-size: 26px; color: #8b95a3; }
  #mmsg { display: block; font-size: 30px; color: #ffcf66; margin-top: 8px; line-height: 1.3; }
  #mmsg:empty { display: none; }
  /* Library: a panel on the right; the controls step aside while it is open. */
  #mlib { display: none; position: absolute; right: 0; top: 0; width: 820px; height: 1080px; box-sizing: border-box;
    padding: 56px 50px 0; background: rgba(8,10,14,.95); }
  body.mlib #mlib { display: block; }
  body.mlib #mwin { width: 900px; }
  body.mlib #mctl, body.mlib #mdev { visibility: hidden; }
  #mlib .mwbar { display: block; font-size: 46px; font-weight: 300; margin-bottom: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mlibwin { height: 864px; overflow: hidden; }
  #mlist { transition: transform .15s; }
  .mrow { display: flex; align-items: center; height: 88px; margin-bottom: 8px; padding: 0 16px; box-sizing: border-box;
    border-radius: 12px; border: 2px solid transparent; font-size: 30px; }
  .mrow.focus { border-color: #ffb300; background: #232a35; }
  .mrow.quiet { color: #8b95a3; }
  .mthumb { width: 68px; height: 68px; flex: none; margin-right: 20px; border-radius: 8px; background: #232a35; object-fit: cover; }
  .mtext { flex: 1; min-width: 0; }
  .mt, .ms { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms { font-size: 22px; color: #8b95a3; margin-top: 2px; }
  #mlibfoot { font-size: 22px; color: #7d8794; margin-top: 14px; }

  /* The retro look: a late-90s desktop player. Silver bevelled windows, a navy title bar, a black
     LCD with a segment clock, buttons that press in. Square corners and 3px bevels throughout. */
  #music.retro { font-family: Tahoma, "MS Sans Serif", "Helvetica Neue", Arial, sans-serif; }
  #music.retro #mwin, #music.retro #mlib { background: #c0c0c0; color: #000; text-shadow: none; box-sizing: border-box; padding: 9px;
    border: 3px solid; border-color: #fff #000 #000 #fff;
    box-shadow: inset -3px -3px 0 #808080, inset 3px 3px 0 #dfdfdf, 0 20px 70px rgba(0,0,0,.75); }
  #music.retro #mwin { left: 50px; width: 1240px; }
  #music.retro .mwbar { display: flex; align-items: center; justify-content: space-between; height: 54px; margin: 0;
    padding: 0 7px 0 16px; background: linear-gradient(90deg, #000080, #1084d0); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; overflow: hidden; }
  .mwx { display: none; }
  #music.retro .mwx { display: flex; align-items: center; justify-content: center; flex: none; width: 46px; height: 40px;
    background: #c0c0c0; color: #000; border: 3px solid; border-color: #fff #000 #000 #fff; box-sizing: border-box;
    box-shadow: inset -2px -2px 0 #808080; }
  .mwx svg { width: 26px; height: 26px; }
  #music.retro #mbody { grid-template-columns: 300px 1fr; grid-column-gap: 16px; align-items: stretch; padding: 14px 10px 6px; }
  #music.retro #mart { grid-row: 1; width: 300px; height: 300px; border-radius: 0; background: #000; box-sizing: border-box;
    border: 3px solid; border-color: #808080 #fff #fff #808080; box-shadow: inset 3px 3px 0 #000; padding: 3px; }
  #music.retro #mlcd { grid-row: 1; background: #030803; color: #3cff70; box-sizing: border-box; padding: 18px 24px 0; overflow: hidden;
    border: 3px solid; border-color: #808080 #fff #fff #808080; box-shadow: inset 3px 3px 0 #000;
    font-family: "Courier New", Menlo, Consolas, monospace; }
  #music.retro #mlcdtop { display: flex; justify-content: space-between; align-items: flex-start; }
  #mclock { display: block; }
  #mflags span { display: block; text-align: right; font-size: 22px; font-weight: 700; letter-spacing: 4px; line-height: 34px; color: #0c3318; }
  #mflags span.on { color: #3cff70; text-shadow: 0 0 10px rgba(60,255,112,.7); }
  #music.retro #mtitle { font-size: 42px; font-weight: 700; line-height: 1.2; margin-top: 16px; text-overflow: clip;
    color: #3cff70; text-shadow: 0 0 10px rgba(60,255,112,.55); }
  #music.retro #mtitle.scroll span { padding-left: 100%; animation: mmarq 14s linear infinite; }
  @keyframes mmarq { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  #music.retro #martist { font-size: 30px; font-weight: 700; color: #2bbf55; margin-top: 6px; }
  #music.retro #malbum { font-size: 26px; color: #1c8a3c; margin-top: 2px; }
  #music.retro #mseek, #music.retro #mctl, #music.retro #mstat { grid-column: 1 / span 2; }
  #music.retro #mseek { margin-top: 14px; }
  #music.retro #mpos, #music.retro #mdur { color: #000; font-weight: 700; }
  #music.retro #mbar { height: 34px; border-radius: 0; background: #fff; box-sizing: border-box; padding: 3px;
    border: 3px solid; border-color: #808080 #fff #fff #808080; box-shadow: inset 2px 2px 0 #000; }
  #music.retro #mfill { background: repeating-linear-gradient(90deg, #000080 0, #000080 18px, transparent 18px, transparent 22px); }
  #music.retro #mctl { margin-top: 10px; height: 82px; }
  #music.retro .mbtn { min-width: 98px; height: 74px; margin: 4px 8px 4px 0; border-radius: 0; background: #c0c0c0; color: #000;
    font-size: 26px; font-weight: 700; border: 3px solid; border-color: #fff #000 #000 #fff;
    box-shadow: inset -3px -3px 0 #808080, inset 3px 3px 0 #dfdfdf; }
  #music.retro .mbtn.on { background: #d4d4d4; color: #000080; border-color: #000 #fff #fff #000; box-shadow: inset 3px 3px 0 #808080; }
  #music.retro .mbtn.focus { background: #000080; color: #fff; outline: 2px dotted #fff; outline-offset: -11px; }
  #music.retro #mstat { display: flex; margin-top: 8px; min-height: 0; }
  #music.retro #mdev, #music.retro #mmsg { display: block; box-sizing: border-box; min-height: 44px; margin: 0; padding: 6px 12px;
    font-size: 24px; line-height: 28px; color: #000; border: 2px solid; border-color: #808080 #fff #fff #808080; }
  #music.retro #mdev { flex: none; min-width: 300px; white-space: nowrap; }
  #music.retro #mmsg { flex: 1; margin-left: 6px; color: #800000; font-weight: 700; }
  #music.retro #mmsg:empty { display: block; }
  /* The library is a second window, beside the player. */
  #music.retro #mlib { right: 40px; top: 26px; width: 580px; height: 1028px; }
  #music.retro .mrow { font-size: 28px; }
  body.mlib #music.retro #mwin { width: 1240px; }
  body.mlib #music.retro #mctl, body.mlib #music.retro #mdev { visibility: visible; }
  #music.retro #mlibwin { margin-top: 10px; background: #000; box-sizing: content-box;
    border: 3px solid; border-color: #808080 #fff #fff #808080; }
  #music.retro .mrow { height: 96px; margin: 0; border: 0; border-radius: 0; color: #3cff70; font-weight: 700; }
  #music.retro .mrow.focus { background: #000080; color: #fff; }
  #music.retro .mrow.quiet { color: #1c8a3c; }
  #music.retro .mthumb { border-radius: 0; background: #0c3318; }
  #music.retro .ms { color: #1c8a3c; font-weight: 400; }
  #music.retro .mrow.focus .ms { color: #b9c6ff; }
  #music.retro #mlibfoot { margin-top: 8px; padding: 6px 12px; font-size: 22px; color: #000;
    border: 2px solid; border-color: #808080 #fff #fff #808080; }
</style>
</head>
<body>
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="top">
    <div><div id="clock">--:--</div><div id="date"></div><div id="count"></div></div>
    <div id="now"><div id="temp"></div><div><span id="wx"></span><span id="aq"></span></div><div id="alert"></div><div id="net"></div></div>
  </div>
  <div id="grid"></div>
  <div id="forecast">
    <div class="panel" id="periods"></div>
    <div class="panel" id="days"><div class="ptitle">Next 10 days</div><div id="dayrow"></div></div>
  </div>
  <div id="idle"><div id="iclock"></div><div id="idate"></div><div id="icount"></div><div id="iwx"></div><div id="ialert"></div><div id="inet"></div></div>
  <div id="brief">
    <div id="bleft">
      <div id="bclock"></div><div id="bdate"></div><div id="bcount"></div>
      <div id="bnow"></div><div id="baq"></div><div id="balert"></div>
      <div class="panel prow" id="bperiods"></div>
    </div>
    <div class="panel" id="bright"><div id="bagenda"></div></div>
  </div>
  <div id="status"></div>
  <div id="market"></div>
  <div id="setup"><div id="sqr"></div><div id="stext"><div id="stitle"></div><div id="smsg"></div><div id="surl"></div><div id="scode"></div><div id="sbtns"></div><div id="sfoot"></div></div></div>
  <div id="music">
    <canvas id="mviz" width="1920" height="1080"></canvas>
    <div id="mover">
      <div id="mwin">
        <div class="mwbar"><span id="mwtitle">Music</span><span id="mclose" class="mwx"></span></div>
        <div id="mbody">
          <div id="mart"><img id="martimg" alt=""></div>
          <div id="mlcd">
            <div id="mlcdtop"><canvas id="mclock" width="340" height="112"></canvas>
              <div id="mflags"><span id="fshuffle">SHUFFLE</span><span id="frepeat">REPEAT</span><span id="flike">LIKED</span></div></div>
            <div id="mtitle"><span></span></div><div id="martist"></div><div id="malbum"></div>
          </div>
          <div id="mseek"><span id="mpos"></span><div id="mbar"><div id="mfill"></div></div><span id="mdur"></span></div>
          <div id="mctl"></div>
          <div id="mstat"><span id="mdev"></span><span id="mmsg"></span></div>
        </div>
      </div>
      <div id="mlib"><div class="mwbar"><span id="mlibtitle"></span></div><div id="mlibwin"><div id="mlist"></div></div><div id="mlibfoot"></div></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="helpers.js"></script>
  <script src="settings.js"></script>
  <script src="calendar.js"></script>
