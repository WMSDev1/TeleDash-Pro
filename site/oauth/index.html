<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only our own script and stylesheet; the Google code never leaves for anywhere but the TV. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>TeleDash Pro sign-in</title>
<link rel="stylesheet" href="../style.css">
</head>
<body id="td-oauth">
<main class="narrow">
  <h1>TeleDash Pro</h1>
  <p class="card" id="status">Checking the sign-in...</p>
  <a class="button hidden" id="setup" href="#">Back to setup</a>
  <noscript><p class="card">This page needs JavaScript to hand the Google sign-in back to your TV.</p></noscript>
  <p class="muted">This page passes Google's answer to the TeleDash Pro helper on your TV. It only ever
    forwards to a private address on your home network and stores nothing.</p>
</main>
<script src="validate.js"></script>
</body>
</html>
